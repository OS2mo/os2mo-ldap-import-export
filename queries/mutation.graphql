# Warning: bitemporal deletion, NOT temporal termination. Leaves no trace in any
# temporal listing and cannot be undone. Only use when fully purging IT-users
# (e.g. when decommissioning a deprecated IT-system).
mutation ituser_delete($uuid: UUID!) {
  ituser_delete(uuid: $uuid) {
    uuid
  }
}

# Bitemporal deletion, see warning on ituser_delete above.
mutation itsystem_delete($uuid: UUID!) {
  itsystem_delete(uuid: $uuid) {
    uuid
  }
}

